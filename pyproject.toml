[project]
name = "images-api"
version = "0.1.0"
description = "Единый API генерации изображений с арбитражем VRAM на нескольких GPU-узлах"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pillow>=10.3",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
]

# Здесь НЕТ torch и не будет: шлюз не грузит модели. Всё, что трогает GPU,
# живёт в worker/ и запускается из venv соответствующей модели.

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/images_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # длину строк держим глазами
    "B008",   # Depends(...) в аргументах по умолчанию — это и есть способ FastAPI
    # Комментарии и docstring'и на русском: ruff видит кириллические «с», «е», «а»
    # как «неоднозначные» латинские. Для нас это ложные срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
    # %-форматирование используется единообразно во всём проекте, в том числе в
    # worker/, который обязан импортироваться на Python 3.10 (node-b).
    "UP031",
    # WorkerUnavailable / WorkerRejected читаются лучше без суффикса Error.
    "N818",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
