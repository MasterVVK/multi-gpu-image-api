[project]
name = "images-worker"
version = "0.1.0"
description = "Тонкий воркер генерации изображений: один процесс — один бэкенд — одна модель."
requires-python = ">=3.10"

# ВАЖНО: список зависимостей намеренно ПУСТОЙ.
# Пакет ставится в четыре чужих venv с несовместимыми пинами
# (torch 2.5.1/2.9.1/2.10.0, transformers 4.57.1/4.57.3/5.1.0/5.5.4).
# fastapi/uvicorn/pydantic там уже есть, а `pip install --no-deps` при пустом
# списке структурно не может сдвинуть ни один существующий пин.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["images_worker"]
